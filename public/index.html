    <script>
        // Page d'aiguillage : envoie chaque visiteur vers /fr/ ou /en/ selon la langue du navigateur,
        // en gardant l'ancre (#privacy, #terms, #legal, #delete) utilisee par l'app et les e-mails.
        (function () {
            var userLang = (navigator.language || "").toLowerCase();
            var target = userLang.indexOf("fr") === 0 ? "/fr/" : "/en/";
            window.location.replace(target + window.location.search + window.location.hash);
        })();
    </script>
