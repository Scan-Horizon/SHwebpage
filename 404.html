<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#050a15">
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
    <title>Page introuvable | ScanHorizon</title>
    <style>
        html, body { margin: 0; min-height: 100%; background: #050a15; color: #ffffff; }
        body {
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            display: grid; place-items: center; min-height: 100vh;
            padding: 0 16px; box-sizing: border-box; text-align: center;
        }
        main { max-width: 34rem; }
        img { width: 88px; height: 88px; }
        .code { font-family: monospace; letter-spacing: 0.2em; color: #38b6ff; margin: 1.2rem 0 0.4rem; }
        h1 { font-size: clamp(1.6rem, 6vw, 2.4rem); margin: 0 0 0.6rem; line-height: 1.15; }
        p { color: #b0c4de; margin: 0 0 1.6rem; line-height: 1.6; }
        nav { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        a {
            color: #38b6ff; text-decoration: none; font-family: monospace; font-weight: bold;
            border: 1px solid rgba(56, 182, 255, 0.4); border-radius: 999px; padding: 10px 18px;
        }
        a:hover, a:focus-visible { background: rgba(56, 182, 255, 0.12); outline: none; }
    </style>
</head>
<body>
    <main>
        <img src="/logo.webp" alt="ScanHorizon" width="160" height="160">
        <p class="code">ERREUR 404 · SIGNAL PERDU</p>
        <h1>Cet avion a quitté le radar.</h1>
        <p>La page demandée n'existe pas ou a changé d'adresse.<br>This page has left the radar.</p>
        <nav aria-label="Retour / Back">
            <a href="/fr/" hreflang="fr">Retour à l'accueil</a>
            <a href="/en/" hreflang="en">Back to home</a>
        </nav>
    </main>
</body>
</html>
